name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: verify (node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ['20', '22']
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}

      # js-yaml is needed by the verifier's YAML round-trip assertions; the
      # plugin itself ships zero runtime dependencies.
      - name: Install dev dependencies
        run: npm install --no-audit --no-fund

      - name: Verify committed bundles parse
        run: |
          node --check lib/index.js
          node --check lib/client.js
          node --check scripts/verify.mjs

      - name: Run the offline verification harness
        run: node scripts/verify.mjs
